cartesian_pose_torque_controller:
  type: panda_custom_controllers/CartesianPoseTorqueController
  arm_id: panda
  joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7

  # Atomic CartesianPoseCommand containing a pose and Boolean gripper state.
  command_topic: desired_cartesian_pose_command
  base_frame: panda_link0

  # Diagonal gains ordered as [x, y, z, rotation-x, rotation-y, rotation-z].
  cartesian_stiffness: [200.0, 200.0, 200.0, 10.0, 10.0, 10.0]
  cartesian_damping: [28.2843, 28.2843, 28.2843, 6.3246, 6.3246, 6.3246]

  # cartesian_stiffness: [300.0, 300.0, 300.0, 20.0, 20.0, 20.0]
  # cartesian_damping: [34.641, 34.641, 34.641, 8.944, 8.944, 8.944]
  
  # cartesian_stiffness: [400.0, 400.0, 400.0, 30.0, 30.0, 30.0]
  # cartesian_damping: [40.0, 40.0, 40.0, 10.954, 10.954, 10.954]

  coriolis_factor: 1.0
  delta_tau_max: 1.0

  # The command's gripper_grasp field: true grasps; false opens.
  # Gripper actions execute asynchronously from the arm's real-time torque loop.
  enable_gripper: true
  gripper_move_action_name: /franka_gripper/move
  gripper_grasp_action_name: /franka_gripper/grasp
  gripper_speed: 0.05
  gripper_force: 20.0
  gripper_open_width: 0.08

  # A zero target and wide outer tolerance allow contact at an unknown object width.
  gripper_grasp_width: 0.0
  gripper_epsilon_inner: 0.005
  gripper_epsilon_outer: 0.08
  gripper_server_timeout: 0.5
