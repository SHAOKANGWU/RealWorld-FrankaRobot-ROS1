joint_position_reproduction:
  # The order here defines the order of every trajectory row.
  joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7

  # This is the default topic resolved by a root-level ros_control controller
  # named joint_position_torque_controller.
  command_topic: /joint_position_torque_controller/desired_joint_position_command
  controller_name: joint_position_torque_controller

  # Replay starts only when every measured joint is this close to row one.
  start_joint_tolerance: 0.02  # rad

  # One trajectory row is published per period. The controller holds each
  # position until the next row arrives.
  publish_rate: 25.0
  wait_for_subscriber_timeout: 0.0  # Zero waits indefinitely for a running controller.
  loop: false
  hold_final_command: true

  # Configure either trajectory or trajectory_file, but not both. A trajectory_file
  # generated by convert_trajectory_to_txt.py contains 15 values per line:
  # [x, y, z, qx, qy, qz, qw, joint1, ..., joint7, gripper]. This node uses
  # the seven joint positions and gripper action. Inline trajectory rows retain
  # the shorter [joint1, ..., joint7, gripper] format. Empty inputs prevent movement.
  trajectory: []
  trajectory_file: ""

  # Example only:
  # trajectory:
  #   - [0.0, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854, 0]
  #   - [0.1, -0.7854, 0.0, -2.3562, 0.0, 1.5708, 0.7854, 1]
